# Workspace-level tooling config. The installable packages live in
# services/vehicle and services/agent; see requirements-dev.txt.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/vehicle", "services/agent", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "sitl: needs a running ArduPilot SITL (set MAVMIND_SITL=1)",
  "llm: calls the Anthropic API (needs ANTHROPIC_API_KEY)",
  "ros: needs ROS 2 + MAVROS",
]
filterwarnings = ["ignore::DeprecationWarning:pymavlink.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "E501", "B905"]  # long strings/tables are clearer unwrapped; pairwise zips are intentional

[tool.ruff.lint.per-file-ignores]
"tests/tlogs/generate_synthetic.py" = ["E501"]
