[package]
name = "mavmind"
version = "0.1.0"
description = "MAVMind - LLM-assisted drone ground station"
authors = ["MAVMind"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
[lib]
name = "mavmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
